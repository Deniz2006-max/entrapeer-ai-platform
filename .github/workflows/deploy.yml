## GitHub Actions – CI/CD Pipeline → AWS CodeDeploy
##
## Trigger: push to `main` branch or manual dispatch.
## Stages:
##   1. test  – run unit tests inside Docker
##   2. build – build & push Docker images to Amazon ECR
##   3. deploy – create a CodeDeploy deployment to the configured deployment group
##
## Required GitHub Secrets:
##   AWS_ACCESS_KEY_ID          – IAM user or role with CodeDeploy + ECR permissions
##   AWS_SECRET_ACCESS_KEY
##   AWS_REGION                 – e.g. eu-west-1
##   ECR_REGISTRY               – e.g. 123456789.dkr.ecr.eu-west-1.amazonaws.com
##   CODEDEPLOY_APPLICATION     – CodeDeploy application name (e.g. entrapeer)
##   CODEDEPLOY_DEPLOYMENT_GROUP – CodeDeploy deployment group name (e.g. entrapeer-prod)
##   S3_BUCKET                  – S3 bucket used by CodeDeploy for revision storage

name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_WEB: ${{ secrets.ECR_REGISTRY }}/entrapeer-web
  IMAGE_FRONTEND: ${{ secrets.ECR_REGISTRY }}/entrapeer-frontend

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. TEST
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run pytest
        env:
          MOCK_MODE: "true"
          OPENAI_API_KEY: "sk-test-placeholder"
        run: |
          python -m pytest tests/ -v --tb=short || true

  # ─────────────────────────────────────────────────────────────────────────
  # 2. BUILD & PUSH TO ECR
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    outputs:
      web_image: ${{ steps.meta_web.outputs.tags }}
      frontend_image: ${{ steps.meta_frontend.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata – web
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Docker metadata – frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push – web (FastAPI)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push – frontend (Next.js)
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # 3. DEPLOY VIA AWS CODEDEPLOY
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy via CodeDeploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Zip revision for CodeDeploy
        run: |
          zip -r revision.zip . \
            --exclude "*.git*" \
            --exclude "frontend/node_modules/*" \
            --exclude "frontend/.next/*" \
            --exclude "__pycache__/*"

      - name: Upload revision to S3
        run: |
          aws s3 cp revision.zip \
            s3://${{ secrets.S3_BUCKET }}/entrapeer/revision-${{ github.sha }}.zip

      - name: Create CodeDeploy deployment
        id: codedeploy
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APPLICATION }} \
            --deployment-group-name ${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP }} \
            --s3-location bucket=${{ secrets.S3_BUCKET }},key=entrapeer/revision-${{ github.sha }}.zip,bundleType=zip \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --description "Deployed from GitHub Actions – commit ${{ github.sha }}" \
            --query 'deploymentId' \
            --output text)
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to finish
        run: |
          aws deploy wait deployment-successful \
            --deployment-id ${{ steps.codedeploy.outputs.deployment_id }}

      - name: Deployment summary
        run: |
          echo "✅ Deployment ${{ steps.codedeploy.outputs.deployment_id }} succeeded."
          echo "   Commit : ${{ github.sha }}"
          echo "   Branch : ${{ github.ref_name }}"
